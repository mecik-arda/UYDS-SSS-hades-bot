services:
  uyds_sohbet_botu_uygulamasi:
    image: hadesbot-uygulama:yerel
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uyds_asistani
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    read_only: true
    ports:
      - "${UYGULAMA_PORT:-8000}:8000"
    volumes:
      - ./veriler:/uygulama/veriler
      - ./modeller:/uygulama/modeller:ro
      - ./sirlar:/run/secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      - ORTAM_PROFILI=${ORTAM_PROFILI:-prod}
      - DEEPSEEK_API_ANAHTARI=${DEEPSEEK_API_ANAHTARI:-}
      - DEEPSEEK_API_ANAHTAR_DOSYASI=${DEEPSEEK_API_ANAHTAR_DOSYASI:-}
      - DEEPSEEK_API_ADRESI=${DEEPSEEK_API_ADRESI:-https://api.deepseek.com/chat/completions}
      - DEEPSEEK_MODEL_ADI=${DEEPSEEK_MODEL_ADI:-deepseek-v4-pro}
      - DEEPSEEK_ZAMAN_ASIMI_SANIYE=${DEEPSEEK_ZAMAN_ASIMI_SANIYE:-120}
      - DEEPSEEK_YENIDEN_DENEME_SAYISI=${DEEPSEEK_YENIDEN_DENEME_SAYISI:-2}
      - DEEPSEEK_YENIDEN_DENEME_TABAN_SANIYE=${DEEPSEEK_YENIDEN_DENEME_TABAN_SANIYE:-0.5}
      - DEEPSEEK_KAYNAK_SAYISI=${DEEPSEEK_KAYNAK_SAYISI:-5}
      - DEEPSEEK_KAYNAK_MAKS_KARAKTER=${DEEPSEEK_KAYNAK_MAKS_KARAKTER:-6000}
      - DEEPSEEK_IZINLI_ALAN_ADLARI=${DEEPSEEK_IZINLI_ALAN_ADLARI:-api.deepseek.com}
      - DEEPSEEK_YANIT_MAKS_KARAKTER=${DEEPSEEK_YANIT_MAKS_KARAKTER:-32768}
      - DEEPSEEK_AKIS_MAKS_SANIYE=${DEEPSEEK_AKIS_MAKS_SANIYE:-180}
      - VERITABANI_YOLU=${VERITABANI_YOLU:-veriler/veri_deposu.db}
      - VERITABANI_SIFRELEME_ANAHTARI=${VERITABANI_SIFRELEME_ANAHTARI:-}
      - GUVEN_ESIGI=${GUVEN_ESIGI:-0.70}
      - VEKTOR_MODEL_ADI=${VEKTOR_MODEL_ADI:-paraphrase-multilingual-MiniLM-L12-v2}
      - VEKTOR_MODEL_YOLU=${VEKTOR_MODEL_YOLU:-modeller/paraphrase-multilingual-MiniLM-L12-v2}
      - VEKTOR_BOYUTU=${VEKTOR_BOYUTU:-384}
      - VEKTOR_TOPLU_ISLEM_BOYUTU=${VEKTOR_TOPLU_ISLEM_BOYUTU:-32}
      - ES_ANLAMLILAR_YOLU=${ES_ANLAMLILAR_YOLU:-veriler/es_anlamlilar.json}
      - HF_HOME=/tmp/huggingface
      - TORCH_HOME=/tmp/torch
      - JWT_GIZLI_ANAHTARI=${JWT_GIZLI_ANAHTARI:-}
      - JWT_ALGORITMASI=${JWT_ALGORITMASI:-HS256}
      - JWT_OMRU_DAKIKA=${JWT_OMRU_DAKIKA:-30}
      - JWT_YENILEME_OMRU_GUN=${JWT_YENILEME_OMRU_GUN:-7}
      - JWT_ANAHTAR_KIMLIGI=${JWT_ANAHTAR_KIMLIGI:-ana-1}
      - JWT_ONCEKI_GIZLI_ANAHTAR=${JWT_ONCEKI_GIZLI_ANAHTAR:-}
      - JWT_ONCEKI_ANAHTAR_KIMLIGI=${JWT_ONCEKI_ANAHTAR_KIMLIGI:-}
      - YONETICI_ISTEK_IMZA_ANAHTARI=${YONETICI_ISTEK_IMZA_ANAHTARI:-}
      - YONETICI_IMZA_ZAMAN_PENCERESI_SANIYE=${YONETICI_IMZA_ZAMAN_PENCERESI_SANIYE:-300}
      - VARSAYILAN_YONETICI_SIFRESI=${VARSAYILAN_YONETICI_SIFRESI:-}
      - ISTEK_SINIRI=${ISTEK_SINIRI:-100}
      - ISTEK_PENCERESI_SANIYE=${ISTEK_PENCERESI_SANIYE:-60}
      - UYGULAMA_PORT=${UYGULAMA_PORT:-8000}
      - MESAJ_MAKS_KARAKTER=${MESAJ_MAKS_KARAKTER:-2000}
      - DEEPSEEK_MAKS_TOKEN=${DEEPSEEK_MAKS_TOKEN:-4096}
      - GUNLUK_MESAJ_KOTASI=${GUNLUK_MESAJ_KOTASI:-500}
      - OTURUM_MAKS_MESAJ=${OTURUM_MAKS_MESAJ:-50}
      - OTURUM_TTL_DAKIKA=${OTURUM_TTL_DAKIKA:-30}
      - OTURUM_MAKS_SAYI=${OTURUM_MAKS_SAYI:-1000}
      - ESZAMANLI_AKIS_MAKS_SAYI=${ESZAMANLI_AKIS_MAKS_SAYI:-10}
      - UYGULAMA_WORKER_SAYISI=1
      - UVICORN_WORKERS=1
      - GUVENLIK_BAKIM_ARALIGI_SAAT=${GUVENLIK_BAKIM_ARALIGI_SAAT:-6}
      - ISTEK_GOVDE_MAKS_BOYUT=${ISTEK_GOVDE_MAKS_BOYUT:-1048576}
      - DOSYA_YUKLEME_MAKS_BOYUT=${DOSYA_YUKLEME_MAKS_BOYUT:-52428800}
      - LOG_SEVIYESI=${LOG_SEVIYESI:-INFO}
      - RRF_K=${RRF_K:-60}
      - FTS_ADAY_SAYISI=${FTS_ADAY_SAYISI:-50}
      - VEKTOR_ADAY_SAYISI=${VEKTOR_ADAY_SAYISI:-50}
      - RRF_ADAY_SAYISI=${RRF_ADAY_SAYISI:-20}
      - ALTERNATIF_SORU_ADAY_SAYISI=${ALTERNATIF_SORU_ADAY_SAYISI:-5}
      - ALTERNATIF_SORU_BENZERLIK_ESIGI=${ALTERNATIF_SORU_BENZERLIK_ESIGI:-0.70}
      - YENIDEN_SIRALAMA_ETKIN=${YENIDEN_SIRALAMA_ETKIN:-false}
      - YENIDEN_SIRALAMA_MODEL_YOLU=${YENIDEN_SIRALAMA_MODEL_YOLU:-modeller/mmarco-mMiniLMv2-L12-H384-v1}
      - YENIDEN_SIRALAMA_ADAY_SAYISI=${YENIDEN_SIRALAMA_ADAY_SAYISI:-10}
      - YENIDEN_SIRALAMA_TOPLU_ISLEM_BOYUTU=${YENIDEN_SIRALAMA_TOPLU_ISLEM_BOYUTU:-8}
      - YENIDEN_SIRALAMA_MAKS_TOKEN=${YENIDEN_SIRALAMA_MAKS_TOKEN:-512}
      - FTS_SORU_AGIRLIGI=${FTS_SORU_AGIRLIGI:-1.0}
      - FTS_CEVAP_AGIRLIGI=${FTS_CEVAP_AGIRLIGI:-1.0}
      - FTS_KATEGORI_AGIRLIGI=${FTS_KATEGORI_AGIRLIGI:-1.0}
      - FTS_HARICI_KOD_AGIRLIGI=${FTS_HARICI_KOD_AGIRLIGI:-1.0}
      - FTS_MODUL_AGIRLIGI=${FTS_MODUL_AGIRLIGI:-1.0}
      - FTS_ARAMA_METNI_AGIRLIGI=${FTS_ARAMA_METNI_AGIRLIGI:-1.0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/hazirlik')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 45s

  uyds_yedekleyici:
    image: hadesbot-uygulama:yerel
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    read_only: true
    command:
      - python
      - yedekle.py
      - zamanla
      - --aralik-saat
      - ${YEDEKLEME_ARALIGI_SAAT:-24}
    volumes:
      - ./veriler:/uygulama/veriler
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      - VERITABANI_YOLU=${VERITABANI_YOLU:-veriler/veri_deposu.db}
      - ES_ANLAMLILAR_YOLU=${ES_ANLAMLILAR_YOLU:-veriler/es_anlamlilar.json}
      - MAKSIMUM_YEDEK_SAYISI=${MAKSIMUM_YEDEK_SAYISI:-10}
      - YEDEKLEME_ARALIGI_SAAT=${YEDEKLEME_ARALIGI_SAAT:-24}
    depends_on:
      uyds_sohbet_botu_uygulamasi:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      disable: true
